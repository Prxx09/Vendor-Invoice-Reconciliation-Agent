name: Invoice approach comparison
on:
  push:
    branches: [feature/pdf-extraction-poc]
    paths:
      - "comparison/**"
      - "tests/ground_truth.json"
      - ".github/workflows/approach-comparison.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_TEXT_MODEL: qwen/qwen3.8-27b
      GROQ_VISION_MODEL: qwen/qwen3.8-27b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run same-schema benchmark
        run: python -m comparison.benchmark
      - name: Persist benchmark results
        run: |
          mkdir -p comparison/results
          cp benchmark-results.json comparison/results/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparison/results/latest.json
          git diff --cached --quiet || git commit -m "chore: update approach benchmark results"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approach-comparison-results
          path: benchmark-results.json
