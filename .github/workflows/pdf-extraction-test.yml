name: PDF extraction POC

on:
  push:
    branches: [feature/pdf-extraction-poc]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GROQ_MODEL: openai/gpt-oss-120b
      HF_MODEL: Qwen/Qwen2.5-72B-Instruct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Verify invoice fixtures
        run: |
          test -n "$(find tests/fixtures -maxdepth 1 -name '*.pdf' -print -quit)" || (echo "Upload the two PDFs to tests/fixtures/" && exit 1)
      - name: Run extraction and LLM tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -v
